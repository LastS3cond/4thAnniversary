<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undertale - 4th Anniversary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <!-- Retro CRT & Frame Container -->
    <div id="screen-container">
      <canvas id="game-canvas" width="640" height="480"></canvas>
      <div id="crt-overlay"></div>
    </div>
    <div id="controls-hint">
      <span class="key-badge">WASD / Arrow Keys</span> Move & Navigate &nbsp;|&nbsp;
      <span class="key-badge">Z / Enter</span> Confirm & Interact &nbsp;|&nbsp;
      <span class="key-badge">X / Shift</span> Cancel / Run / Skip &nbsp;|&nbsp;
      <span class="key-badge">C</span> Menu
    </div>
  </div>

  <!-- Audio and Game Scripts -->
  <script src="src/audio.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/dialogue.js"></script>
  <script src="src/maps.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/finale.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
