<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undertale - 4th Anniversary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game-wrapper">
    <!-- Retro CRT & Frame Container -->
    <div id="screen-container">
      <canvas id="game-canvas" width="640" height="480"></canvas>
      <div id="crt-overlay"></div>
    </div>
    <div id="controls-hint">
      <span class="key-badge">WASD / Arrow Keys</span> Move & Navigate &nbsp;|&nbsp;
      <span class="key-badge">Z / Enter</span> Confirm & Interact &nbsp;|&nbsp;
      <span class="key-badge">X / Shift</span> Cancel / Skip &nbsp;|&nbsp;
      <span class="key-badge">C</span> Menu
    </div>
  </div>

  <!-- Engine core -->
  <script src="src/core/input.js"></script>
  <script src="src/core/text.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/sprites.js"></script>
  <script src="src/dialogue.js"></script>

  <!-- World: art toolkit, prop sprites, interactions, map manager, then one file per room -->
  <script src="src/world/art.js"></script>
  <script src="src/world/props.js"></script>
  <script src="src/world/interactions.js"></script>
  <script src="src/world/map_manager.js"></script>
  <script src="src/rooms/exterior.js"></script>
  <script src="src/rooms/first_floor.js"></script>
  <script src="src/rooms/staircase.js"></script>
  <script src="src/rooms/second_floor.js"></script>

  <!-- Screens and the main loop -->
  <script src="src/ui/title_screen.js"></script>
  <script src="src/ui/overworld_menu.js"></script>
  <script src="src/battle.js"></script>
  <script src="src/finale.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
